[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketbase"
version = "0.2.0"
description = "A 股客观行情、日线、分钟线、基础映射与数据审计管线"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
local = ["pyarrow>=15"]
data-cn = [
    "efinance>=0.4",
    "akshare>=1.10",
    "baostock>=0.8.9",
    "tushare>=1.4",
]
full = [
    "pyarrow>=15",
    "efinance>=0.4",
    "akshare>=1.10",
    "baostock>=0.8.9",
    "tushare>=1.4",
]
dev = ["pytest", "ruff"]

[project.scripts]
marketbase = "local_workflow:main"

[tool.setuptools]
include-package-data = true
py-modules = ["local_workflow"]

[tool.setuptools.packages.find]
include = ["marketbase*"]

[tool.setuptools.data-files]
"." = ["SKILL.md", "LICENSE"]
"agents" = ["agents/openai.yaml"]
