<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketBase 输出查看器</title>
<style>
  :root {
    --bg: #1a1b1e; --panel-bg: #1e1f23; --border: #2d2e33;
    --text: #d4d4d8; --text-dim: #8b8b90; --accent: #4f8cff;
    --accent-hover: #6ba0ff; --accent-bg: #4f8cff15; --selection: #4f8cff33;
    --success: #34d399; --warn: #fbbf24; --danger: #f87171;
    --tag-bg: #2a2b30; --hover-bg: #26272c; --radius: 8px; --radius-sm: 6px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .header {
    height: 48px; min-height: 48px; display: flex; align-items: center;
    padding: 0 16px; border-bottom: 1px solid var(--border);
    background: var(--panel-bg); gap: 12px; user-select: none;
  }
  .header .logo { font-weight: 700; font-size: 14px; letter-spacing: -0.3px; color: #fff; white-space: nowrap; }
  .header .logo span { color: var(--accent); }
  .header .divider { width: 1px; height: 20px; background: var(--border); }
  .header .status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .header .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  .header .actions { margin-left: auto; display: flex; gap: 6px; }
  .btn {
    height: 30px; padding: 0 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--panel-bg);
    color: var(--text); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 5px; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--hover-bg); border-color: #555; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .output-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  .output-toolbar {
    height: 36px; min-height: 36px; display: flex; align-items: center;
    padding: 0 12px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--panel-bg);
  }
  .file-tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .file-tabs::-webkit-scrollbar { display: none; }
  .file-tab {
    height: 26px; padding: 0 10px; border-radius: 4px; font-size: 11px;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    background: transparent; color: var(--text-dim); border: none; white-space: nowrap; transition: all .12s;
  }
  .file-tab:hover { background: var(--hover-bg); color: var(--text); }
  .file-tab.active { background: var(--accent-bg); color: var(--accent); }
  .file-tab .close-tab {
    width: 14px; height: 14px; display: flex; align-items: center; justify-content: center;
    border-radius: 3px; font-size: 10px; opacity: 0; transition: opacity .12s;
  }
  .file-tab:hover .close-tab { opacity: 0.6; }
  .file-tab .close-tab:hover { opacity: 1; background: rgba(255,255,255,0.1); }
  .output-content {
    flex: 1; overflow: auto; padding: 16px; position: relative;
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
  }
  .output-content.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .output-content.drag-over::after {
    content: '释放以加载文件'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-bg); font-size: 16px; color: var(--accent); font-weight: 600; pointer-events: none;
  }
  /* Data table */
  .output-content table { border-collapse: collapse; font-size: 12px; width: 100%; }
  .output-content th {
    position: sticky; top: 0; background: #25262b; padding: 8px 12px; text-align: left;
    font-weight: 600; color: var(--text-dim); border-bottom: 2px solid var(--border);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .output-content td { padding: 6px 12px; border-bottom: 1px solid #25262b; }
  .output-content tr:hover td { background: #25262b33; }
  .output-content .num { text-align: right; font-variant-numeric: tabular-nums; }
  .output-content .positive { color: var(--danger); }
  .output-content .negative { color: var(--success); }
  .output-content .json-key { color: #79c0ff; }
  .output-content .json-string { color: #a5d6ff; }
  .output-content .json-number { color: #79c0ff; }
  .output-content .json-boolean { color: #ff7b72; }
  .output-content .json-null { color: #8b949e; }
  .output-content .log-info { color: #79c0ff; }
  .output-content .log-warn { color: var(--warn); }
  .output-content .log-error { color: var(--danger); }
  .output-content .log-debug { color: var(--text-dim); }
  .empty-state {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; color: var(--text-dim); pointer-events: none;
  }
  .empty-state .icon { font-size: 40px; opacity: 0.3; }
  .empty-state .title { font-size: 14px; font-weight: 500; }
  .empty-state .hint { font-size: 12px; opacity: 0.6; text-align: center; line-height: 1.8; }
  .empty-state .hint kbd {
    background: #2a2b30; padding: 2px 6px; border-radius: 3px;
    border: 1px solid var(--border); font-family: inherit; font-size: 11px;
  }
  /* Conversation panel */
  .conv-panel { width: 380px; min-width: 300px; display: flex; flex-direction: column; background: var(--panel-bg); }
  .conv-header {
    height: 40px; min-height: 40px; display: flex; align-items: center;
    padding: 0 14px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; gap: 8px; user-select: none;
  }
  .conv-header .badge {
    background: var(--accent-bg); color: var(--accent);
    font-size: 11px; padding: 1px 6px; border-radius: 10px; font-weight: 500;
  }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .conv-item {
    background: #25262b; border-radius: var(--radius); border: 1px solid transparent;
    overflow: hidden; transition: border-color .15s; animation: slideIn .2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .conv-item:hover { border-color: var(--border); }
  .conv-item-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; cursor: pointer; user-select: none;
  }
  .conv-item-header .item-title { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .conv-item-header .item-type {
    font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--accent-bg); color: var(--accent);
  }
  .conv-item-header .item-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .conv-item:hover .item-actions { opacity: 1; }
  .item-action {
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; cursor: pointer; color: var(--text-dim); font-size: 12px;
    background: none; border: none; transition: all .12s;
  }
  .item-action:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .item-action.danger:hover { color: var(--danger); }
  .conv-item-body {
    padding: 0 10px 10px; font-size: 11px;
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
    line-height: 1.5; max-height: 120px; overflow-y: auto;
    color: var(--text-dim); white-space: pre-wrap; word-break: break-all;
    border-top: 1px solid #2d2e33; margin: 0 10px; padding: 8px 0;
  }
  .conv-footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .conv-footer .btn { width: 100%; justify-content: center; }
  /* Floating button */
  .floating-btn {
    position: absolute; z-index: 100; padding: 5px 10px; border-radius: 6px;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 500;
    cursor: pointer; border: none; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 2px 12px rgba(79,140,255,0.4); transition: transform .12s, box-shadow .12s;
    animation: btnPop .15s ease; pointer-events: auto; white-space: nowrap;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  @keyframes btnPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .floating-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(79,140,255,0.5); }
  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 8px 18px; border-radius: 20px;
    font-size: 12px; z-index: 200; animation: toastIn .3s ease, toastOut .3s ease 1.5s forwards; pointer-events: none;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3b40; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4b50; }
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .conv-panel { width: 100%; min-width: 0; max-height: 40vh; }
    .output-panel { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<!-- Header -->
<div class="header">
  <div class="logo">Market<span>Base</span> 输出查看器</div>
  <div class="divider"></div>
  <div class="status"><span class="dot"></span><span id="statusText">就绪</span></div>
  <div class="actions">
    <button class="btn" onclick="loadSampleData()">📋 示例数据</button>
    <button class="btn" onclick="document.getElementById('fileInput').click()">📂 打开文件</button>
    <input type="file" id="fileInput" hidden accept=".csv,.json,.log,.txt,.md" onchange="handleFileUpload(event)" multiple>
    <button class="btn" onclick="loadMarketBaseData()">📊 加载本地数据</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="output-panel">
    <div class="output-toolbar">
      <div class="file-tabs" id="fileTabs"></div>
      <button class="btn" onclick="clearOutput()" style="font-size:11px;height:24px;padding:0 8px;">清除</button>
    </div>
    <div class="output-content" id="outputContent"
         onmouseup="handleSelection()" onkeyup="handleSelection()"
         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
      <div class="empty-state" id="emptyState">
        <div class="icon">📂</div>
        <div class="title">拖拽文件到此处，或点击上方按钮加载数据</div>
        <div class="hint">
          支持 CSV / JSON / Markdown / 日志文件<br>
          选中文本后按 <kbd>Ctrl+Enter</kbd> 快速添加到对话
        </div>
      </div>
    </div>
  </div>

  <div class="conv-panel">
    <div class="conv-header">
      💬 对话上下文
      <span class="badge" id="convCount">0</span>
    </div>
    <div class="conv-list" id="convList">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);gap:8px;font-size:12px;text-align:center;padding:20px;">
        💡 选中输出内容<br>自动添加到此处
      </div>
    </div>
    <div class="conv-footer">
      <button class="btn" onclick="copyAllContext()">📋 复制全部上下文</button>
      <button class="btn" onclick="clearContext()" style="color:var(--text-dim);">🗑 清空上下文</button>
    </div>
  </div>
</div>

<div id="floatingBtnContainer"></div>
<div id="toastContainer"></div>

<script>
'use strict';

// ── State ──
var state = {
  files: {},
  activeFile: null,
  conversation: [],
  nextId: 1
};

var $output = document.getElementById('outputContent');
var $empty = document.getElementById('emptyState');
var $tabs = document.getElementById('fileTabs');
var $convList = document.getElementById('convList');
var $convCount = document.getElementById('convCount');
var $status = document.getElementById('statusText');
var $float = document.getElementById('floatingBtnContainer');

// ── Utils ──
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(s) {
  return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function isNumeric(str) {
  return !isNaN(parseFloat(str)) && isFinite(str);
}

function updateStatus(msg) {
  $status.textContent = msg;
  setTimeout(function() { $status.textContent = '就绪'; }, 3000);
}

function showToast(msg) {
  var toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(function() { toast.remove(); }, 2000);
}

// ── File Loading ──
function handleFileUpload(e) {
  var files = e.target.files;
  for (var i = 0; i < files.length; i++) loadFile(files[i]);
  e.target.value = '';
}

function handleDragOver(e) {
  e.preventDefault();
  $output.classList.add('drag-over');
}

function handleDragLeave(e) {
  $output.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  $output.classList.remove('drag-over');
  var files = e.dataTransfer.files;
  for (var i = 0; i < files.length; i++) loadFile(files[i]);
}

function loadFile(file) {
  var reader = new FileReader();
  reader.onload = function() {
    var raw = reader.result;
    var ext = file.name.split('.').pop().toLowerCase();
    var type = detectType(file.name, ext);
    var content = formatContent(raw, type);
    state.files[file.name] = { content: content, type: type, raw: raw, name: file.name };
    switchTab(file.name);
    updateStatus('已加载 ' + file.name);
  };
  reader.readAsText(file);
}

function detectType(name, ext) {
  if (ext === 'csv') return 'csv';
  if (ext === 'json') return 'json';
  if (ext === 'md') return 'markdown';
  if (ext === 'log' || name.indexOf('log') >= 0) return 'log';
  return 'text';
}

function formatContent(raw, type) {
  switch (type) {
    case 'csv': return renderCSV(raw);
    case 'json': return renderJSON(raw);
    case 'markdown': return renderMarkdown(raw);
    case 'log': return renderLog(raw);
    default: return escapeHtml(raw);
  }
}

// ── Renderers ──
function parseCSVLine(line) {
  var result = [];
  var current = '';
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
        else { inQuotes = false; }
      } else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ''; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

function renderCSV(raw) {
  var lines = raw.trim().split('\n');
  if (lines.length < 2) return escapeHtml(raw);
  var headers = parseCSVLine(lines[0]);
  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    var row = parseCSVLine(lines[i]);
    if (row.length > 0) rows.push(row);
  }
  var html = '<table><thead><tr>';
  for (var h = 0; h < headers.length; h++) {
    html += '<th>' + escapeHtml(headers[h]) + '</th>';
  }
  html += '</tr></thead><tbody>';
  for (var r = 0; r < rows.length; r++) {
    html += '<tr>';
    for (var c = 0; c < headers.length; c++) {
      var val = (rows[r][c] || '').trim();
      var cls = isNumeric(val) ? 'num' : '';
      var color = '';
      if (val.indexOf('-') === 0) color = 'negative';
      else if (isNumeric(val) && parseFloat(val) > 0) color = 'positive';
      html += '<td class="' + cls + ' ' + color + '">' + escapeHtml(val) + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function syntaxHighlightJSON(obj) {
  var json = JSON.stringify(obj, null, 2);
  return json.replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^"\\])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
    var cls = 'json-number';
    if (/^"/.test(match)) {
      if (/:$/.test(match)) cls = 'json-key';
      else cls = 'json-string';
    } else if (/true|false/.test(match)) cls = 'json-boolean';
    else if (/null/.test(match)) cls = 'json-null';
    return '<span class="' + cls + '">' + match + '</span>';
  });
}

function renderJSON(raw) {
  try {
    var obj = JSON.parse(raw);
    return '<pre>' + syntaxHighlightJSON(obj) + '</pre>';
  } catch(e) {
    return escapeHtml(raw);
  }
}

function renderMarkdown(raw) {
  var html = raw;
  html = html.replace(/^### (.+)$/gm, '<h3 style="font-size:14px;margin:12px 0 4px;color:#fff;">$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2 style="font-size:16px;margin:16px 0 6px;color:#fff;border-bottom:1px solid #2d2e33;padding-bottom:4px;">$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1 style="font-size:18px;margin:20px 0 8px;color:#fff;">$1</h1>');
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    return '<pre style="background:#1a1b24;padding:12px;border-radius:6px;overflow-x:auto;margin:8px 0;">' + escapeHtml(code.trim()) + '</pre>';
  });
  html = html.replace(/`([^`]+)`/g, '<code style="background:#2a2b30;padding:1px 5px;border-radius:3px;font-size:12px;">$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--accent);" target="_blank">$1</a>');
  return html;
}

function renderLog(raw) {
  var lines = raw.split('\n');
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var lower = line.toLowerCase();
    var cls = '';
    if (lower.indexOf('error') >= 0 || lower.indexOf('fail') >= 0 || lower.indexOf('exception') >= 0) cls = 'log-error';
    else if (lower.indexOf('warn') >= 0) cls = 'log-warn';
    else if (lower.indexOf('debug') >= 0 || lower.indexOf('trace') >= 0) cls = 'log-debug';
    else if (lower.indexOf('info') >= 0 || lower.indexOf('success') >= 0) cls = 'log-info';
    html += '<span class="' + cls + '">' + escapeHtml(line) + '</span>\n';
  }
  return html;
}

// ── Tab Management ──
function switchTab(filename) {
  state.activeFile = filename;
  var file = state.files[filename];
  if (!file) return;
  $output.innerHTML = file.content;
  $empty.style.display = 'none';
  renderTabs();
}

function renderTabs() {
  var names = Object.keys(state.files);
  var html = '';
  for (var i = 0; i < names.length; i++) {
    var n = names[i];
    var active = n === state.activeFile ? ' active' : '';
    var icon = state.files[n].type === 'csv' ? '📊' :
               state.files[n].type === 'json' ? '📋' :
               state.files[n].type === 'markdown' ? '📝' :
               state.files[n].type === 'log' ? '📜' : '📄';
    var display = n.length > 25 ? n.slice(0, 22) + '...' : n;
    html += '<button class="file-tab' + active + '" onclick="switchTab(\'' + escapeAttr(n) + '\')">' +
            icon + ' ' + escapeHtml(display) +
            '<span class="close-tab" onclick="event.stopPropagation();closeTab(\'' + escapeAttr(n) + '\')">✕</span>' +
            '</button>';
  }
  $tabs.innerHTML = html;
}

function closeTab(filename) {
  delete state.files[filename];
  var names = Object.keys(state.files);
  if (filename === state.activeFile) {
    if (names.length > 0) {
      switchTab(names[names.length - 1]);
    } else {
      state.activeFile = null;
      $output.innerHTML = '';
      $empty.style.display = '';
    }
  }
  renderTabs();
}

function clearOutput() {
  state.files = {};
  state.activeFile = null;
  $output.innerHTML = '';
  $empty.style.display = '';
  renderTabs();
}

// ── Selection & Floating Button ──
function handleSelection() {
  $float.innerHTML = '';
  var sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  var text = sel.toString().trim();
  if (!text) return;

  // Check selection is within output panel
  var range = sel.getRangeAt(0);
  if (!$output.contains(range.commonAncestorContainer)) return;

  // Calculate button position
  var rect = range.getBoundingClientRect();
  var btnTop = rect.bottom + window.scrollY + 6;
  var btnLeft = rect.left + window.scrollX + (rect.width / 2);

  var btn = document.createElement('button');
  btn.className = 'floating-btn';
  btn.innerHTML = '➕ 添加到对话';
  btn.style.position = 'fixed';
  btn.style.top = (rect.bottom + 8) + 'px';
  btn.style.left = (rect.left + rect.width / 2) + 'px';
  btn.style.transform = 'translateX(-50%)';
  btn.onmousedown = function(e) {
    e.preventDefault(); // prevent losing selection
  };
  btn.onclick = function() {
    addToConversation(text, getCurrentType());
    showToast('已添加到对话上下文');
    $float.innerHTML = '';
    window.getSelection().removeAllRanges();
  };
  $float.appendChild(btn);

  // Close when clicking elsewhere
  setTimeout(function() {
    document.addEventListener('mousedown', function closeFloat(e) {
      if (!$float.contains(e.target) && !$output.contains(e.target)) {
        $float.innerHTML = '';
        document.removeEventListener('mousedown', closeFloat);
      }
    });
  }, 0);
}

function getCurrentType() {
  if (state.activeFile && state.files[state.activeFile]) {
    return state.files[state.activeFile].type;
  }
  return 'text';
}

// ── Conversation Panel ──
function addToConversation(text, type) {
  var id = state.nextId++;
  var item = {
    id: id,
    title: text.slice(0, 60).replace(/\n/g, ' ') + (text.length > 60 ? '...' : ''),
    type: type || 'text',
    content: text,
    timestamp: new Date()
  };
  state.conversation.unshift(item);
  renderConversation();
}

function renderConversation() {
  var items = state.conversation;
  $convCount.textContent = items.length;

  if (items.length === 0) {
    $convList.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);gap:8px;font-size:12px;text-align:center;padding:20px;">💡 选中输出内容<br>自动添加到此处</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var typeLabel = item.type === 'csv' ? 'CSV' : item.type === 'json' ? 'JSON' : item.type === 'markdown' ? 'MD' : item.type === 'log' ? 'LOG' : 'TXT';
    html += '<div class="conv-item">' +
      '<div class="conv-item-header" onclick="this.parentElement.querySelector(\'.conv-item-body\').style.display = this.parentElement.querySelector(\'.conv-item-body\').style.display === \'none\' ? \'block\' : \'none\'">' +
        '<span class="item-title">' +
          '<span class="item-type">' + typeLabel + '</span>' +
          escapeHtml(item.title) +
        '</span>' +
        '<span class="item-actions">' +
          '<button class="item-action" onclick="event.stopPropagation();copyConvItem(' + item.id + ')" title="复制">📋</button>' +
          '<button class="item-action danger" onclick="event.stopPropagation();removeConvItem(' + item.id + ')" title="删除">✕</button>' +
        '</span>' +
      '</div>' +
      '<div class="conv-item-body">' + escapeHtml(item.content) + '</div>' +
    '</div>';
  }
  $convList.innerHTML = html;
}

function removeConvItem(id) {
  state.conversation = state.conversation.filter(function(item) { return item.id !== id; });
  renderConversation();
}

function copyConvItem(id) {
  var item = state.conversation.find(function(it) { return it.id === id; });
  if (!item) return;
  navigator.clipboard.writeText(item.content).then(function() {
    showToast('已复制到剪贴板');
  });
}

function copyAllContext() {
  if (state.conversation.length === 0) { showToast('上下文为空'); return; }
  var all = state.conversation.map(function(item) {
    return '--- ' + item.type.toUpperCase() + ' ---\n' + item.content;
  }).join('\n\n');
  navigator.clipboard.writeText(all).then(function() {
    showToast('已复制 ' + state.conversation.length + ' 条上下文');
  });
}

function clearContext() {
  state.conversation = [];
  renderConversation();
  showToast('上下文已清空');
}

// ── Keyboard Shortcut ──
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    var text = sel.toString().trim();
    if (!text) return;
    if (!$output.contains(sel.getRangeAt(0).commonAncestorContainer)) return;
    addToConversation(text, getCurrentType());
    showToast('已添加到对话上下文 (Ctrl+Enter)');
    $float.innerHTML = '';
    sel.removeAllRanges();
  }
});
